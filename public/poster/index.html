<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kacha Haus · Poster</title>
<!-- Shop-screen poster (portrait 9:16, 1080x1920), composition from Figma "Frame 5", animated with GSAP.
     Built for a weak player: every layer is a finished image (made by tools/poster_assets.py) and only transform/opacity
     animate, so the GPU just moves pictures; no filters, masks, blend modes or SVG are redrawn per frame.
     Back to front: bg.jpg (gradient, glow, camo) · 2/10 rows (alternate rows run left / right) · model · KACHA HAUS (letters
     rise in one by one, a light band sweeps across, they lift out, loop) · logo.
     URL options: ?rows=40 (px/s of the 2/10 rows, 0 = still) -->
<style>
html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; opacity: 0;
  background: #000 url(bg.jpg) 0 0 / 1080px 1920px no-repeat; }
.row { position: absolute; left: 0; height: 160px; background: url(row.png) 0 0 / auto 160px repeat-x; will-change: transform; backface-visibility: hidden; }
.girl { position: absolute; left: -84px; top: 360px; width: 1248px; height: 1560px; }   /* Figma frame drawn 1.3x, ~20% left above her */
#word { position: absolute; left: 0; width: 1080px; overflow: hidden; }
.ltr { position: absolute; top: 0; background: url(word.png) no-repeat; will-change: transform; backface-visibility: hidden; }
#band { position: absolute; top: 0; left: 0; width: 300px; overflow: hidden; will-change: transform; opacity: 0;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 45%, #000 55%, transparent); mask-image: linear-gradient(90deg, transparent, #000 45%, #000 55%, transparent); }
#lit { position: absolute; top: 0; left: 0; width: 1080px; background: url(word-lit.png) no-repeat; will-change: transform; }
.logo { position: absolute; left: 29px; top: 1845px; width: 57px; height: 56px; }
</style></head>
<body>
<div id="stage">
  <div id="rows"></div>
  <img class="girl" src="girl.webp" alt="">
  <div id="word" aria-label="KACHA HAUS"><div id="band"><div id="lit"></div></div></div>
  <img class="logo" src="k-symbol.svg" alt="">
</div>
<script src="gsap.min.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), rowSpeed = q.has('rows') ? +q.get('rows') : 40;
  var stage = document.getElementById('stage');
  gsap.config({ force3D: true });

  function fit () {   // clientWidth, not innerWidth: the unscaled stage can widen the layout viewport on phones/players
    var W = document.documentElement.clientWidth, H = document.documentElement.clientHeight, s = Math.min(W / 1080, H / 1920);
    stage.style.transform = 'translate(' + (W - 1080 * s) / 2 + 'px,' + (H - 1920 * s) / 2 + 'px) scale(' + s + ')'; }
  addEventListener('resize', fit); fit();

  function build (L) {
    // 2/10 rows: one shared image strip per row, two loops wide; fade towards the top is a fixed opacity per row
    var host = document.getElementById('rows'), loop = L.rowLoop;
    for (var i = 0; i < 17; i++) {
      var y = i * 116 - 36, a = 1;                                        // every row full strength, top included
            var row = document.createElement('div'); row.className = 'row';
      row.style.top = y + 'px'; row.style.width = Math.ceil(loop * 2) + 'px'; row.style.opacity = a.toFixed(3);
      host.appendChild(row);
      var start = -((i * 137) % loop);
      gsap.set(row, { x: start });
      if (rowSpeed > 0) gsap.to(row, { x: start + (i % 2 ? loop : -loop), duration: loop / rowSpeed, ease: 'none', repeat: -1,
        modifiers: { x: gsap.utils.unitize(gsap.utils.wrap(-loop, 0)) } });
    }

    // KACHA HAUS: each letter is a window onto word.png; the clip is the static #word box
    var word = document.getElementById('word'), band = document.getElementById('band'), lit = document.getElementById('lit');
    word.style.top = L.top + 'px'; word.style.height = L.h + 'px'; band.style.height = lit.style.height = L.h + 'px';
    var letters = L.letters.map(function (b) {
      var d = document.createElement('div'); d.className = 'ltr';
      d.style.left = b[0] + 'px'; d.style.width = b[1] + 'px'; d.style.height = L.h + 'px';
      d.style.backgroundPosition = (-b[0]) + 'px 0'; word.insertBefore(d, band); return d;
    });
    var H = L.h, from = L.left - 300, to = L.left + L.width;
    gsap.set(letters, { y: H });
    var tl = gsap.timeline({ repeat: -1, repeatDelay: .5 });
    // rise in one by one, long ease-out, no overshoot
    tl.to(letters, { y: 0, duration: 1.8, ease: 'expo.out', stagger: .08 }, .3);
    // light band sweeps across twice: the band moves right while the white letters inside it move left by the same amount
    [1.9, 5.6].forEach(function (t) {
      tl.set(band, { opacity: 1 }, t);
      tl.fromTo(band, { x: from }, { x: to, duration: 2.8, ease: 'power2.inOut' }, t);
      tl.fromTo(lit, { x: -from }, { x: -to, duration: 2.8, ease: 'power2.inOut' }, t);
      tl.set(band, { opacity: 0 }, t + 2.8);
    });
    // lift out the top one by one, then start again from below
    tl.to(letters, { y: -H, duration: 1.3, ease: 'power3.inOut', stagger: .05 }, 9.4);
    tl.set(letters, { y: H });

    gsap.to(stage, { opacity: 1, duration: 1.6, ease: 'expo.out' });
  }

  // wait for the images so nothing pops in half-decoded
  var srcs = ['bg.jpg', 'row.png', 'word.png', 'word-lit.png', 'girl.webp'], left = srcs.length + 1, layout;
  function done () { if (--left === 0) build(layout); }
  srcs.forEach(function (s) { var im = new Image(); im.onload = im.onerror = done; im.src = s; });
  fetch('layout.json').then(function (r) { return r.json(); }).then(function (j) { layout = j; done(); });
})();
</script>
</body></html>
